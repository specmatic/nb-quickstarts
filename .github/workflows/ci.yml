name: CI

# Validate configuration and builds, and exercise unit and contract tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs when the same branch receives another push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Validate Docker Compose definitions ----
  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Use the example environment so Compose can resolve its settings.
      - name: Prepare .env
        run: cp .env.example .env

      - name: Validate compose files
        run: |
          set -e
          for f in $(find . -name 'docker-compose*.yml' -not -path './.git/*'); do
            echo "::group::$f"
            docker compose -f "$f" --env-file .env config -q
            echo "::endgroup::"
          done

  # ---- Python lint and syntax checks ----
  python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pinned in requirements-dev.txt so an upstream ruff release cannot
      # change what CI enforces without a commit here (Renovate raises the
      # upgrade as a reviewable PR instead).
      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile $(find . -name '*.py' -not -path './.git/*')

      - name: Ruff lint
        run: ruff check locust/bin apps/backend kafka/bridge

  # ---- Shell syntax checks ----
  # Scripts and Makefiles use zsh; ShellCheck does not support it.
  # Check syntax with the actual interpreter instead.
  shell:
    name: Syntax check (zsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh -n
        run: |
          set -e
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            echo "checking $f"
            zsh -n "$f"
          done

  # ---- Frontend TypeScript checks ----
  typescript:
    name: Typecheck frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.23"

      - name: Install dependencies
        working-directory: apps/frontend
        run: |
          # Match the Dockerfile's fix for npm's dependency-resolution bug.
          npm install -g npm@11
          npm ci

      - name: tsc --noEmit
        working-directory: apps/frontend
        run: npm run typecheck

  # ---- Dockerfile lint and build checks ----
  docker:
    name: Lint & build Dockerfile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: locust/Dockerfile
            context: locust
            tag: nb-quickstarts/locust:ci
          - dockerfile: apps/backend/Dockerfile
            context: apps/backend
            tag: nb-quickstarts/apps-backend:ci
          - dockerfile: apps/frontend/Dockerfile
            context: apps/frontend
            tag: nb-quickstarts/apps-frontend:ci
          - dockerfile: kafka/bridge/Dockerfile
            context: kafka/bridge
            tag: nb-quickstarts/kafka-bridge:ci
    steps:
      - uses: actions/checkout@v5

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Only errors fail this check; minor warnings remain informational.
          failure-threshold: error

      - name: Build image
        run: docker build -t ${{ matrix.tag }} ${{ matrix.context }}

  # Each matrix entry runs on its own runner, with no dependencies on other jobs.
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Keep the other suites running if one fails.
      fail-fast: false
      matrix:
        include:
          - suite: backend-unit
            name: Backend unit tests
            target: pytest:test
            report: pytest/report
            ctrf: ''
            publish: false
            finalize: ''
            setup: ''
            logs: ''
            cleanup: ''
          - suite: frontend-unit
            name: Frontend unit tests
            target: vitest:test
            report: vitest/report
            ctrf: ''
            publish: false
            finalize: ''
            setup: ''
            logs: ''
            cleanup: ''
          - suite: consumer-contract
            name: Consumer contract tests
            target: vitest:contract-test
            report: |
              vitest/report-contract
              specmatic/report/stub
            ctrf: specmatic/report/stub/ctrf/*.json
            publish: false
            finalize: docker compose -p specmatic -f specmatic/docker-compose.yml stop --timeout 30 specmatic-mock
            setup: |
              make specmatic:mock-up
              curl --fail --silent --show-error --retry 30 --retry-delay 2 \
                --retry-all-errors --retry-max-time 120 --max-time 5 \
                http://localhost:9091/health
            logs: docker compose -p specmatic -f specmatic/docker-compose.yml logs --no-color > ci-logs/mock.log
            cleanup: docker compose -p specmatic -f specmatic/docker-compose.yml down
          - suite: provider-contract
            name: Provider contract tests
            target: specmatic:test
            report: |
              specmatic/report
              specmatic/junit
            ctrf: specmatic/report/test/ctrf/*.json
            publish: true
            finalize: ''
            setup: |
              make apps-network-ensure
              docker compose -p apps -f apps/docker-compose.yml up -d --build \
                --wait --wait-timeout 120 mysql-server backend
              curl --fail --silent --show-error --retry 30 --retry-delay 2 \
                --retry-all-errors --retry-max-time 120 --max-time 5 \
                http://localhost:8080/health
            logs: docker compose -p apps -f apps/docker-compose.yml logs --no-color > ci-logs/backend.log
            cleanup: docker compose -p apps -f apps/docker-compose.yml down --volumes
    steps:
      - uses: actions/checkout@v5

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Start required services
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Run tests
        env:
          TEST_TARGET: ${{ matrix.target }}
        run: make "$TEST_TARGET"

      # Mock usage reports are written during graceful shutdown.
      - name: Finalize reports
        if: always() && matrix.finalize != ''
        run: ${{ matrix.finalize }}

      - name: Collect service logs
        if: always() && matrix.logs != ''
        run: |
          mkdir -p ci-logs
          ${{ matrix.logs }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.suite }}-results
          path: |
            ${{ matrix.report }}
            ci-logs/
          retention-days: 14

      - name: Upload CTRF report
        if: always() && matrix.ctrf != ''
        uses: actions/upload-artifact@v6
        with:
          name: ctrf-report-${{ matrix.suite }}
          path: ${{ matrix.ctrf }}
          retention-days: 5
          if-no-files-found: error

      - name: Publish test results
        if: always() && matrix.publish
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: ${{ matrix.ctrf }}

      - name: Stop required services
        if: always() && matrix.cleanup != ''
        run: ${{ matrix.cleanup }}
